<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Mac Control Center</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <div class="app">
        <button class="close-btn" id="close-btn" title="Hide (⌥Space to reopen)">✕</button>
      <nav class="rail">
        <button class="rail-btn active" data-view="system" title="System">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        </button>
        <button class="rail-btn" data-view="spotify" title="Spotify">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </button>
        <button class="rail-btn" data-view="calendar" title="Calendar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </button>
      </nav>

      <main class="content">
        <!-- SYSTEM -->
        <section class="view active" id="view-system">
          <header class="head"><h1>System</h1></header>
          <section class="stats">
            <div class="stat">
              <span class="k">CPU</span><span class="v" id="cpu">—</span>
            </div>
            <div class="stat">
              <span class="k">Memory</span><span class="v" id="mem">—</span>
            </div>
          </section>
          <section class="procs">
            <div class="procs-title">Top processes</div>
            <table>
              <colgroup>
                <col class="col-name" />
                <col class="col-cpu" />
                <col class="col-mem" />
                <col class="col-kill" />
              </colgroup>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>CPU</th>
                  <th>Mem</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="proc-body"></tbody>
            </table>
          </section>
        </section>

        <section class="view" id="view-spotify">
          <div class="sp-glow" id="sp-glow"></div>
          <div class="sp-label">Music</div>
          <div class="sp-art-wrap">
            <img
              class="sp-art-img"
              id="sp-art"
              alt=""
              crossorigin="anonymous"
            />
          </div>
          <div class="sp-meta">
            <div class="sp-now" id="sp-now">—</div>
          </div>
          <div class="sp-seek" id="sp-seek">
            <div class="sp-track-bar">
              <div class="sp-fill" id="sp-fill"></div>
              <div class="sp-knob" id="sp-knob"></div>
            </div>
            <div class="sp-times">
              <span id="sp-cur">0:00</span><span id="sp-dur">0:00</span>
            </div>
          </div>
          <div class="sp-controls">
            <button id="sp-shuffle" class="sp-btn sp-mini" aria-label="Shuffle">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
            </button>
            <button id="sp-prev" class="sp-btn sp-side" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 5h2v14H6zM20 5v14L9 12z" />
              </svg>
            </button>
            <button
              id="sp-playpause"
              class="sp-btn sp-main"
              aria-label="Play/Pause"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <button id="sp-next" class="sp-btn sp-side" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 5h2v14h-2zM4 5l11 7-11 7z" />
              </svg>
            </button>
            <button id="sp-repeat" class="sp-btn sp-mini" aria-label="Repeat">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"
                />
              </svg>
            </button>
          </div>
          <div class="sp-vol">
            <svg viewBox="0 0 24 24" fill="currentColor" class="sp-vol-ic">
              <path d="M3 9v6h4l5 5V4L7 9z" />
            </svg>
            <div class="sp-vol-bar" id="sp-vol-bar">
              <div class="sp-vol-fill" id="sp-vol-fill"></div>
            </div>
            <svg viewBox="0 0 24 24" fill="currentColor" class="sp-vol-ic">
              <path d="M3 9v6h4l5 5V4L7 9z M16 8a5 5 0 010 8" />
            </svg>
          </div>
        </section>

        <!-- CALENDAR -->
        <section class="view" id="view-calendar">
          <div class="cal-head">
            <div class="cal-day" id="cal-day">Today</div>
            <div class="cal-date" id="cal-date">—</div>
          </div>
          <div class="cal-list" id="cal-list">
            <div class="cal-empty">Loading…</div>
          </div>
          <div class="cal-month" id="cal-month"></div>
        </section>
      </main>
    </div>
  </body>
</html>
