<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Mac Control Center</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="panel">
      <header class="head"><h1>Mac Control Center</h1></header>
      <section class="stats">
        <div class="stat">
          <span class="k">CPU</span><span class="v" id="cpu">—</span>
        </div>
        <div class="stat">
          <span class="k">Memory</span><span class="v" id="mem">—</span>
        </div>
      </section>
      <section class="procs">
        <div class="procs-title">Top processes</div>
        <table>
          <thead>
            <tr>
              <th>PID</th>
              <th>Name</th>
              <th>CPU</th>
              <th>Mem</th>
            </tr>
          </thead>
          <tbody id="proc-body"></tbody>
        </table>
      </section>
    </div>
  </body>
</html>
