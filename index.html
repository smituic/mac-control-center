<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Mac Control Center</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <nav class="rail">
        <button class="rail-btn active" data-view="system" title="System">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        </button>
        <button class="rail-btn" data-view="spotify" title="Spotify">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </button>
        <button class="rail-btn" data-view="calendar" title="Calendar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </button>
      </nav>

      <main class="content">
        <section class="view active" id="view-system">
          <header class="head"><h1>System</h1></header>
          <section class="stats">
            <div class="stat">
              <span class="k">CPU</span><span class="v" id="cpu">—</span>
            </div>
            <div class="stat">
              <span class="k">Memory</span><span class="v" id="mem">—</span>
            </div>
          </section>
          <section class="procs">
            <div class="procs-title">Top processes</div>
            <table>
              <thead>
                <tr>
                  <th>PID</th>
                  <th>Name</th>
                  <th>CPU</th>
                  <th>Mem</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="proc-body"></tbody>
            </table>
          </section>
        </section>

        <section class="view" id="view-spotify">
          <header class="head"><h1>Spotify</h1></header>
          <img class="sp-art" id="sp-art" alt="" />
          <div class="sp-now" id="sp-now">—</div>
          <div class="sp-seek">
            <input
              type="range"
              id="sp-seekbar"
              min="0"
              max="100"
              value="0"
              step="1"
            />
            <div class="sp-times">
              <span id="sp-cur">0:00</span><span id="sp-dur">0:00</span>
            </div>
          </div>
          <div class="sp-controls">
            <button id="sp-prev" class="sp-btn">⏮</button>
            <button id="sp-playpause" class="sp-btn sp-main">▶</button>
            <button id="sp-next" class="sp-btn">⏭</button>
          </div>
        </section>

        <section class="view" id="view-calendar">
          <header class="head"><h1>Today</h1></header>
          <div class="cal-list" id="cal-list">
            <div class="placeholder">Loading…</div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
