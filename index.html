<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Mac Control Center</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Mac Control Center</h1>
      <div><strong>CPU:</strong> <span id="cpu">—</span></div>
      <div><strong>Memory:</strong> <span id="mem">—</span></div>
      <h2>Top processes</h2>
      <table>
        <thead>
          <tr>
            <th>PID</th>
            <th>Name</th>
            <th>CPU</th>
            <th>Mem</th>
          </tr>
        </thead>
        <tbody id="proc-body"></tbody>
      </table>
    </main>
  </body>
</html>
